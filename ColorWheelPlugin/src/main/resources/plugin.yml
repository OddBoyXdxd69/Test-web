name: ColorWheelPlugin
version: 1.0.0
main: com.invmc.colorwheel.ColorWheelPlugin
api-version: '1.21'
description: A plugin that runs a color wheel game every 2.5 minutes
author: OddBoyXD
website: https://invmc.in
owner: OddBoyXD

commands:
  colorwheel:
    description: Color wheel game commands
    usage: /<command> [start|stop|force|info|colors]
    permission: colorwheel.admin

permissions:
  colorwheel.admin:
    description: Admin access to color wheel commands
    default: op
  colorwheel.play:
    description: Ability to participate in color wheel games
    default: true
  colorwheel.update:
    description: Receive update notifications
    default: op
