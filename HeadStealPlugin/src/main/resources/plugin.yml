name: HeadStealPlugin
version: 1.0.0
main: com.invmc.headsteal.HeadStealPlugin
api-version: '1.21'
description: HeadSteal SMP plugin - Kill players to steal their heads!
author: OddBoyXD
website: https://invmc.in
owner: OddBoyXD

commands:
  headsteal:
    description: HeadSteal plugin commands
    usage: /<command> [help|top|stats|bal|setbal|head]
    aliases: [hs]
  givehead:
    description: Give a player head
    usage: /<command> <player>
    permission: headsteal.admin

permissions:
  headsteal.admin:
    description: Admin access to HeadSteal commands
    default: op
  headsteal.play:
    description: Ability to steal heads
    default: true
  headsteal.update:
    description: Receive update notifications
    default: op
  headsteal.drops:
    description: Receive head drops on kills
    default: true