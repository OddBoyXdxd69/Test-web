# HeadSteal Plugin Configuration

# Head Drop Settings
drops:
  # Chance (0-100) of getting a head on kill
  drop-chance: 100
  
  # Whether killed players drop their head (defender loses head)
  death-drop: true
  
  # Whether killer gets the victim's head
  killer-gets-head: true
  
  # Drop chance when killed by mob/environment
  mob-death-chance: 10
  
  # Head drop on PvP death (default: 100%)
  pvp-death-chance: 100

# Cooldown Settings
cooldowns:
  # Head theft cooldown in seconds (0 = disabled)
  theft-cooldown: 0

# Economy Settings
economy:
  # Enable economy integration
  enabled: true
  
  # Reward per head stolen
  reward-per-head: 100
  
  # Penalty when your head is stolen
  penalty-on-death: 50

# Leaderboard Settings
leaderboard:
  # Max players shown on /headsteal top
  max-entries: 10

# Messages
messages:
  prefix: "&6&lHeadSteal &r&8» &r"
  head-stolen: "&a✓ You stole &e%victim%&a's head!"
  head-lost: "&c✗ &e%killer% &cstole your head!"
  no-heads: "&cYou don't have any heads!"
  not-enough: "&cYou don't have enough heads!"
  give-head: "&aYou gave &e%player% &ayour head!"
  receive-head: "&aYou received a head from &e%player%&a!"
  top-title: "&6&l=== TOP HEAD STEALERS ==="
  stats-title: "&6&l=== YOUR HEAD STEAL STATS ==="
  stats-heads: "&eHeads: &f%heads%"
  stats-stolen: "&eHeads Stolen: &f%stolen%"
  stats-lost: "&eHeads Lost: &f%lost%"
  no-permission: "&cYou don't have permission to use this command!"
  on-cooldown: "&cYou need to wait &e%time%s &cbefore stealing another head!"
  unknown-command: "&cUnknown command! Use &e/headsteal help"
  head-message: "&6&lHeadSteal &7- Player &e%player%&7's head"